<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A simply supported beam sagging under a central load: the picture behind
       half the relations in the app, and readable at 16px. -->
  <rect width="32" height="32" rx="7" fill="#1F6FEB"/>
  <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
    <!-- load arrow -->
    <path d="M16 5v6"/>
    <path d="M13 8.5 16 11.5 19 8.5" stroke-linejoin="round"/>
    <!-- the beam, deflected -->
    <path d="M6 15c4.5 5.4 15.5 5.4 20 0"/>
  </g>
  <!-- supports -->
  <g fill="#fff">
    <path d="M6 15.5 9 21H3z"/>
    <path d="M26 15.5 29 21h-6z"/>
  </g>
  <rect x="2" y="22.4" width="28" height="2.2" rx="1.1" fill="#fff" opacity=".85"/>
</svg>
